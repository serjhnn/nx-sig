# runs the tests and the style check on every push and
# pull request, see README.md "Tests". no secrets: the
# tests fake the prices, the .env keys and the
# background tasks
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # the order watcher needs it (imaplib IDLE)
          python-version: "3.14"
      - name: install packages
        run: pip install -r requirements.txt
      - name: config
        run: python tests/test_config.py
      - name: storage
        run: python tests/test_storage.py
      - name: order_parser
        run: python tests/test_order_parser.py
      - name: trades
        run: python tests/test_trades.py
      - name: statement
        run: python tests/test_statement.py
      - name: process
        run: python tests/test_process.py
      - name: ladder
        run: python tests/test_ladder.py
      - name: alerts
        run: python tests/test_alerts.py
      - name: notifier
        run: python tests/test_notifier.py
      - name: shell
        run: python tests/test_shell.py
      - name: sync
        run: python tests/test_sync.py
      - name: tasks_owner
        run: python tests/test_tasks_owner.py
      - name: chart
        run: python tests/test_chart.py
      - name: demo
        run: python tests/test_demo.py
      - name: demo_prices
        run: python tests/test_demo_prices.py
      - name: check_style
        run: python scripts/check_style.py
      # no tests yet, so at least check that they
      # compile (TODO.md "Tests for the mail watcher")
      - name: compile mail watcher
        run: >-
          python -m py_compile
          scripts/mtsig/order_watcher.py
          scripts/mtsig/mail_reader.py
      - name: shell scripts syntax
        run: |
          for f in nxshell nxdemo mtsig syncnx migrate_data; do
            bash -n "$f"
          done
