<!-- the top bar and the menu of every page; a page
     has a "frame" comment where web/files.py puts
     them. app.js marks the open page in the menu -->
  <header class="top">
    <a class="mark" href="/">nX-sig</a>
    <span class="chip warn" id="demo" hidden>demo</span>
    <span class="live">
      <span class="dot off" id="live-dot"></span>
      <span id="live-text">waiting for prices</span>
    </span>
    <button class="icon-btn" type="button" id="theme"
      aria-label="Change the theme" title="Dark or light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </header>
