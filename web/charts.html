<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Charts · nX-sig</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<script>
  // the saved theme before the page draws, no flash
  try {
    var t = localStorage.getItem("nx-theme");
    if (t === "dark" || t === "light") {
      document.documentElement.dataset.theme = t;
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <!-- frame -->

  <main class="main">
    <div class="notice" id="notice" role="status" hidden>
      <span class="dot warn"></span>
      <div><b id="notice-title"></b> <span id="notice-text"></span></div>
    </div>

    <div class="notice ok" id="done" role="status" hidden>
      <span class="dot"></span>
      <div id="done-text"></div>
    </div>

    <div class="charts" id="charts"></div>
    <div class="charts-foot" id="charts-foot" hidden>
      <button class="btn sm" type="button" id="add-chart">Add chart</button>
      <span class="muted" id="add-why"></span>
    </div>
  </main>
</div>

<!-- one chart; charts.js copies it for each chart
     and finds its parts by data-part -->
<template id="chart-tpl">
    <section class="panel chart" aria-label="A chart">
      <div class="chart-controls">
        <div class="field">
          <label data-part="stock-label">Stock</label>
          <select data-part="stock"></select>
        </div>
        <div class="field">
          <span class="flabel" data-part="period-label">Period</span>
          <div class="seg periods" role="radiogroup"
            data-part="periods">
            <label><input type="radio" name="days" value="5"
              checked><span>5d</span></label>
            <label><input type="radio" name="days"
              value="30"><span>1m</span></label>
            <label><input type="radio" name="days"
              value="90"><span>3m</span></label>
            <label><input type="radio" name="days"
              value="365"><span>1y</span></label>
          </div>
        </div>
      </div>
      <div class="chart-head">
        <b data-part="name">-</b>
        <span class="px" data-part="price">-</span>
        <span class="chip idle" data-part="change">-</span>
        <span class="muted" data-part="info"></span>
        <button class="icon-btn close" type="button"
          data-part="close" aria-label="Close the chart"
          title="Close" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round">
            <path d="M6 6l12 12M18 6L6 18"/>
          </svg>
        </button>
      </div>
      <div class="plot-wrap">
        <div class="plot" data-part="plot"></div>
        <div class="tip" data-part="tip" hidden></div>
      </div>
      <p class="empty" data-part="empty" hidden></p>
      <div class="legend" data-part="legend" aria-hidden="true">
        <span><i class="lg-line"></i>price</span>
        <span data-part="lg-avg"><i class="lg-avg"></i>avg buy</span>
        <span data-part="lg-b"><i class="lg-b">B</i>buy</span>
        <span data-part="lg-s"><i class="lg-s">S</i>sell</span>
        <span data-part="lg-now"><i class="lg-now"></i>now</span>
      </div>
    </section>
</template>
<script src="/js/app.js"></script>
<script src="/js/charts.js"></script>
</body>
</html>
