<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>nX-sig</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<script>
  // the saved theme before the page draws, no flash
  try {
    var t = localStorage.getItem("nx-theme");
    if (t === "dark" || t === "light") {
      document.documentElement.dataset.theme = t;
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <!-- frame -->

  <main class="main">
    <div class="notice" id="notice" role="status" hidden>
      <span class="dot warn"></span>
      <div><b id="notice-title"></b> <span id="notice-text"></span></div>
    </div>

    <div class="notice ok" id="done" role="status" hidden>
      <span class="dot"></span>
      <div id="done-text"></div>
    </div>

    <div class="row2">
      <section class="panel total" aria-label="Total gain or loss">
        <span class="label">Total gain / loss</span>
        <div class="big">
          <span id="total">-</span>
          <span class="chip idle" id="total-pct">-</span>
        </div>
        <span class="sub" id="total-sub">waiting for prices</span>
      </section>
      <section class="panel kpis wide-only" aria-label="Summary">
        <div><div class="label">Positions</div>
          <div class="kpi" id="kpi-count">-</div></div>
        <div><div class="label">Best</div>
          <div class="kpi" id="kpi-best">-</div></div>
        <div><div class="label">Tasks</div>
          <div class="kpi" id="kpi-tasks">-</div></div>
      </section>
    </div>

    <section class="panel">
      <div class="panel-h"><h2>Positions</h2></div>
      <div class="tbl-wrap">
        <table>
          <thead>
            <tr>
              <th scope="col">Stock</th>
              <th scope="col">Qty</th>
              <th scope="col">Avg</th>
              <th scope="col">Price</th>
              <th scope="col">Gain</th>
              <th scope="col">%</th>
              <th scope="col" class="wide-only"><span hidden>Bar</span></th>
            </tr>
          </thead>
          <tbody id="positions"></tbody>
        </table>
      </div>
      <p class="empty" id="no-positions" hidden>no stocks held</p>
    </section>

    <div class="row2">
      <section class="panel">
        <div class="panel-h"><h2>Background tasks</h2></div>
        <ul class="list" id="tasks"></ul>
        <p class="empty" id="owner" hidden></p>
      </section>
      <section class="panel">
        <div class="panel-h"><h2>Last trades</h2></div>
        <ul class="list" id="trades"></ul>
        <p class="empty" id="no-trades" hidden>no trades yet</p>
      </section>
    </div>
  </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/main.js"></script>
</body>
</html>
