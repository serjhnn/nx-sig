<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alerts · nX-sig</title>
<link rel="icon" href="/logo.svg">
<link rel="stylesheet" href="/style.css">
<script>
  // the saved theme before the page draws, no flash
  try {
    var t = localStorage.getItem("nx-theme");
    if (t === "dark" || t === "light") {
      document.documentElement.dataset.theme = t;
    }
  } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <!-- frame -->

  <main class="main">
    <div class="notice" id="notice" role="status" hidden>
      <span class="dot warn"></span>
      <div><b id="notice-title"></b> <span id="notice-text"></span></div>
    </div>

    <div class="notice ok" id="done" role="status" hidden>
      <span class="dot"></span>
      <div id="done-text"></div>
    </div>

    <section class="panel process" aria-label="The alerts process">
      <span class="dot off" id="proc-dot"></span>
      <div class="process-text">
        <b>Alerts process</b>
        <span class="sub" id="proc-text">-</span>
      </div>
      <span class="chip idle" id="proc-state">-</span>
      <span class="acts" id="proc-acts" hidden>
        <button class="btn primary sm" type="button"
          id="proc-run" hidden>Run</button>
        <button class="btn sm" type="button"
          id="proc-stop" hidden>Stop</button>
      </span>
    </section>

    <section class="panel" id="add" aria-label="Add an alert" hidden>
      <div class="panel-h"><h2>Add an alert</h2></div>
      <form class="form" id="add-form" novalidate>
        <div class="field">
          <span class="flabel" id="f-kind-label">For</span>
          <div class="seg" role="radiogroup"
            aria-labelledby="f-kind-label">
            <label><input type="radio" name="kind"
              value="basetrades" id="f-basetrades" checked
              ><span>Basetrades</span></label>
            <label><input type="radio" name="kind"
              value="gain"><span>Gain</span></label>
          </div>
        </div>
        <div class="field">
          <span class="flabel" id="f-dir-label">Direction</span>
          <div class="seg" role="radiogroup"
            aria-labelledby="f-dir-label">
            <label><input type="radio" name="direction"
              value="down" id="f-down" checked><span
              id="f-down-text">Down</span></label>
            <label><input type="radio" name="direction"
              value="up"><span id="f-up-text">Up</span></label>
          </div>
        </div>
        <div class="field" id="f-percent-field">
          <label for="f-percent">Percent</label>
          <input id="f-percent" type="number" inputmode="decimal"
            min="0" step="any" autocomplete="off">
        </div>
        <div class="field" id="f-stock-field" hidden>
          <label for="f-stock">Stock</label>
          <select id="f-stock"></select>
        </div>
        <div class="field" id="f-value-field" hidden>
          <label for="f-value">Amount</label>
          <input id="f-value" type="number" inputmode="decimal"
            min="0" step="any" autocomplete="off">
        </div>
        <div class="field" id="f-unit-field" hidden>
          <label for="f-unit">In</label>
          <select id="f-unit">
            <option value="amount">money</option>
            <option value="percent">% of avg buy</option>
          </select>
        </div>
        <p class="hint" id="f-hint"></p>
        <p class="form-error" id="f-error" role="alert" hidden></p>
        <div class="form-actions">
          <button class="btn" type="button" id="f-cancel">Cancel</button>
          <button class="btn primary" type="submit"
            id="f-submit">Save</button>
        </div>
      </form>
    </section>

    <section class="panel" aria-label="The alerts">
      <div class="panel-h"><h2>Alerts</h2>
        <span class="sub" id="alerts-sub"></span>
        <button class="btn primary sm" type="button"
          id="add-open" aria-controls="add" aria-expanded="false"
          hidden>Add alert</button></div>
      <div class="alerts" id="alerts"></div>
      <p class="empty" id="no-alerts" hidden>no alerts yet, see
        'help add alert' in the shell</p>
    </section>
  </main>
</div>
<script src="/js/app.js"></script>
<script src="/js/alerts.js"></script>
</body>
</html>
